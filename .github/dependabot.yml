version: 2
updates:
  - package-ecosystem: 'npm'
    # Single-package repo: '/' covers the root package.json and lockfile.
    directory: '/'
    versioning-strategy: 'auto'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10

    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'

    # Let releases age before opening a PR, so x.0.0 bugs surface upstream first.
    # Version updates only: security updates still come through immediately.
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 30

    ignore:
      # Tracks the runtime major in engines.node and .nvmrc; a newer major types APIs
      # Node 26 doesn't have. Bump by hand alongside the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

    # Dependabot assigns a dependency to the FIRST group it matches, so the
    # specific groups must stay above the prod/dev catch-alls at the bottom.
    groups:
      next:
        patterns:
          - 'next'
          - '@next/*'
          - 'eslint-config-next'

      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

      # @storybook/nextjs-vite and vitest both bound vite's major, and
      # eslint-plugin-storybook pins storybook's version, so these move together.
      frontend-tooling:
        patterns:
          - '@storybook/*'
          - 'storybook'
          - 'eslint-plugin-storybook'
          - 'vitest'
          - '@vitest/*'
          - 'vite'

      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'prettier-plugin-tailwindcss'

      # Catch-alls, minor + patch only. Majors fall out as individual PRs so
      # they can be reviewed one at a time.
      prod-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

      # Groups default to applies-to: version-updates, so without these every
      # advisory opens its own PR.
      security-prod:
        applies-to: 'security-updates'
        dependency-type: 'production'

      security-dev:
        applies-to: 'security-updates'
        dependency-type: 'development'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
