name: Checks

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint, format, knip and unit tests: the job every erakor JS repo shares.
  # Pinned to a toolchain commit; Renovate/Dependabot bump it with the package in package.json.
  checks:
    if: ${{ github.event.pull_request.draft == false }}
    uses: erakor/toolchain/.github/workflows/node-checks.yml@7b648f778dfc2e4f0753ef20bb5a0a9484f9377a

  storybook:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the Storybook smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook smoke test
        run: pnpm test:storybook
