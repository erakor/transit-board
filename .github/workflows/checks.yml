name: Checks

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint, format, knip and unit tests: the job every erakor JS repo shares.
  # Pinned to a toolchain commit; Renovate/Dependabot bump it with the package in package.json.
  checks:
    if: ${{ github.event.pull_request.draft == false }}
    uses: erakor/toolchain/.github/workflows/node-checks.yml@1c7c1111a17a5b01999b98616554611d605b7339 # v1.5.0 once tagged

  # Builds Storybook and opens every story in Chromium (the toolchain's storybook-checks.yml).
  storybook:
    if: ${{ github.event.pull_request.draft == false }}
    uses: erakor/toolchain/.github/workflows/storybook-checks.yml@1c7c1111a17a5b01999b98616554611d605b7339 # v1.5.0 once tagged
